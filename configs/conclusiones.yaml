# Conclusiones de validación, escritas después de ver los resultados (umbral 0.5, misma partición para todos).
E0_lr_base: >
  Referencia: detecta casi todos los ataques (recall 0.975) pero alarma al 13.3 % del tráfico normal (FPR 0.133).
  Hipótesis parcialmente confirmada: el modelo lineal es bueno detectando, pero genera muchas falsas alarmas.
E1_lr_balanced: >
  Hipótesis contradicha. Esperaba más recall y más FPR; ocurrió lo contrario (recall 0.942, FPR 0.078). En este
  dataset la clase minoritaria es el tráfico normal, así que "balanced" le da más peso y el modelo alarma menos.
  Cambia el equilibrio de errores (menos falsas alarmas, más ataques perdidos) sin mejorar el macro-F1 (0.927 vs 0.930).
E2_rf_200: >
  Hipótesis confirmada. Mejor macro-F1 (0.948) con recall similar a E0 y FPR menor (0.089 vs 0.133). El cambio de
  familia compensa su costo de entrenamiento en este problema.
E3_rf_shallow: >
  Hipótesis contradicha: pierde 2.6 puntos de macro-F1 frente a E2 (0.922 vs 0.948), no menos de uno. Con poca
  profundidad casi todo se marca como ataque (recall 0.9999, FPR 0.200). Aquí la complejidad sí aporta, sobre todo
  para reconocer tráfico normal.
E4_rf_no_ttl: >
  Hipótesis contradicha: quitar sttl y ct_state_ttl casi no cambia nada (macro-F1 0.948 vs 0.948). Otras variables
  correlacionadas llevan la misma información, así que la dependencia del laboratorio no se elimina quitando solo
  estas dos. Se mantiene como limitación.
