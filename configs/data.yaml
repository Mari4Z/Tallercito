# Configuración de datos y particiones (compartida por todos los experimentos).
seed: 42
val_fraction: 0.20          # se usa StratifiedGroupKFold(n_splits=5) y un fold como validación
raw_dir: data/raw
prepared_dir: data/prepared
train_file: UNSW_NB15_training-set.csv
test_file: UNSW_NB15_testing-set.csv
target: label                # 0 = normal, 1 = ataque (clase positiva)
excluded_from_inputs: [id, label, attack_cat]
