# Cuatro configuraciones: un piso (Dummy) y tres modelos de tres familias (lineal, boosting, bosque).
# Las hipótesis se escriben ANTES de entrenar. Mismas particiones (configs/data.yaml, semilla 42).
# Umbral de referencia para comparar experimentos: 0.5 (el umbral final se elige después, solo con validación).
# Nota de honestidad: una primera ronda (experimento MLflow "unsw-nb15-defiende-el-servidor", descartada) ya usó
# regresión logística y un random forest sobre estas mismas particiones; esa experiencia informa las hipótesis E1 y E3.
mlflow_experiment: unsw-nb15-modelos
seed: 42
threshold: 0.5
experiments:
  - id: E0_dummy
    family: baseline
    change: Piso de comparación. DummyClassifier (strategy=prior) ignora las variables y predice la frecuencia de clase.
    hypothesis: >
      Predice siempre ataque (68 % de las filas son ataque), así que tendrá recall 1.0 y FPR 1.0 con una accuracy
      cercana a 0.68 pero un macro-F1 muy bajo. Sirve para mostrar que la accuracy sola engaña.
    model: {type: DummyClassifier, params: {strategy: prior}}
    drop_features: []
  - id: E1_logreg
    family: logistic_regression
    change: Referencia sencilla. Regresión logística con log1p + estandarización de numéricas y one-hot de categóricas.
    hypothesis: >
      Un modelo lineal ya separa bien normal de ataque porque variables como sttl y ct_state_ttl son casi
      deterministas, pero su frontera lineal dejará muchas falsas alarmas (FPR por encima de 0.10) frente a los modelos de árboles.
    model: {type: LogisticRegression, params: {C: 1.0, max_iter: 2000}}
    drop_features: []
  - id: E2_hgb
    family: gradient_boosting
    change: Cambia de familia respecto a E1. HistGradientBoosting (max_iter=200, early stopping interno solo con train).
    hypothesis: >
      El boosting captura relaciones no lineales y no sufre por las colas pesadas, así que tendrá el mejor macro-F1
      de los cuatro y una FPR menor que la regresión logística, con un modelo guardado de pocos MB.
    model: {type: HistGradientBoostingClassifier, params: {max_iter: 200}}
    drop_features: []
  - id: E3_rf
    family: random_forest
    change: Cambia de familia respecto a E1. Random forest de 100 árboles con min_samples_leaf=5 para limitar el tamaño.
    hypothesis: >
      Rendirá cerca del boosting (diferencia de macro-F1 menor de un punto), aunque su modelo guardado será mucho más
      pesado que el de HistGradientBoosting. En la primera ronda un bosque de 200 árboles sin límite llegó a macro-F1 0.948;
      limitar las hojas debería costar poco.
    model: {type: RandomForestClassifier, params: {n_estimators: 100, min_samples_leaf: 5, n_jobs: -1}}
    drop_features: []
